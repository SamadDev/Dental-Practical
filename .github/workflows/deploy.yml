name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER_HOST: 176.9.120.84
  SERVER_USER: dental
  DEPLOY_PATH: /home/dental/dental-practismart
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----- Checkout -----
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- Setup SSH -----
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "Host ${{ env.SERVER_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh -o ConnectTimeout=10 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo 'SSH OK'"

      # ----- Build Frontend -----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # ----- Deploy via Envoy -----
      - name: Deploy via Envoy
        working-directory: ./backend
        run: ./vendor/bin/envoy run deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # ----- Notify (optional) -----
      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: http://your-domain.com"
          echo "API: http://your-domain.com/api"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check GitHub Actions logs."