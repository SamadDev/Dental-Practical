name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER_HOST: 176.9.120.84
  SERVER_USER: dental
  DEPLOY_PATH: /home/dental/dental-practismart
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----- Checkout -----
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- Setup SSH -----
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      # ----- Build Frontend -----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # ----- Deploy -----
      - name: Deploy to server
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
          set -e

          DEPLOY_DIR="${{ env.DEPLOY_PATH }}"
          BACKEND_DIR="$DEPLOY_DIR/backend"
          FRONTEND_DIR="$DEPLOY_DIR/frontend"

          echo "=== Pulling latest code ==="
          if [ -d "$DEPLOY_DIR/.git" ]; then
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard origin/main
          else
            git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
          fi

          echo "=== Backend: Install dependencies ==="
          cd "$BACKEND_DIR"
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "=== Backend: Environment ==="
          if [ ! -f .env ]; then
            cp .env.example .env
            php artisan key:generate --force
          fi

          echo "=== Backend: Database migrations ==="
          # SQLite (adjust if using MySQL/PostgreSQL)
          touch database/database.sqlite
          php artisan migrate --force

          echo "=== Backend: Seed (safe) ==="
          php artisan db:seed --force || true

          echo "=== Backend: Storage link ==="
          php artisan storage:link

          echo "=== Backend: Cache ==="
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "=== Frontend: Copy built assets ==="
          # Frontend was built in GitHub Actions, copy dist folder
          # We'll copy from the repo's frontend/dist (built above) to server
          # But since we cloned fresh, we need to build on server OR copy from artifact
          # Option: Build on server (simpler, no artifact transfer)
          cd "$FRONTEND_DIR"
          npm ci
          npm run build

          echo "=== Permissions ==="
          chown -R ${{ env.SERVER_USER }}:${{ env.SERVER_USER }} "$DEPLOY_DIR"
          chmod -R 755 "$DEPLOY_DIR"
          chmod -R 775 "$BACKEND_DIR/storage" "$BACKEND_DIR/bootstrap/cache"

          echo "=== Restart backend service ==="
          sudo systemctl reload dental-backend || sudo systemctl restart dental-backend || true

          echo "=== Reload Nginx ==="
          sudo nginx -t && sudo systemctl reload nginx || true

          echo "=== Deploy complete ==="
          ENDSSH

      # ----- Notify (optional) -----
      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: http://your-domain.com"
          echo "API: http://your-domain.com/api"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check GitHub Actions logs."