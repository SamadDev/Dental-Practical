<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>@@FONTS@@</style>
<style>
  :root{
    --b50:#eef2ff; --b100:#e0e7ff; --b200:#c7d2fe; --b300:#a5b4fc; --b400:#818cf8;
    --b500:#5a6ef0; --b600:#4361ee; --b700:#374cd1; --b800:#2f3fa8; --b900:#2b3a85;
    --ink:#0f172a; --s500:#64748b; --s400:#94a3b8;
  }
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;}
  body{font-family:'Vazirmatn','Inter',system-ui,sans-serif;color:var(--ink);
       background:linear-gradient(160deg,#eef2ff 0%,#ffffff 42%,#e0e7ff 100%);}
  .blob{position:absolute;border-radius:50%;}
  .b1{width:760px;height:760px;right:-260px;top:-240px;
      background:radial-gradient(circle at 40% 40%, rgba(165,180,252,.42), rgba(165,180,252,0) 70%);}
  .b2{width:860px;height:860px;left:-300px;bottom:-360px;
      background:radial-gradient(circle at 55% 45%, rgba(129,140,248,.30), rgba(129,140,248,0) 70%);}
  .page{position:relative;width:100%;height:100%;box-sizing:border-box;overflow:hidden;
        padding:150px 80px 160px;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;justify-content:space-between;will-change:transform,opacity;}
  .brand{display:flex;align-items:center;gap:22px;}
  .logo{width:84px;height:84px;border-radius:24px;flex:none;
        background:linear-gradient(135deg,var(--b600),var(--b400));
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 16px 32px -10px rgba(67,97,238,.55);}
  .cname{font-weight:700;font-size:44px;line-height:1.1;}
  .handle{font-family:'Inter',sans-serif;font-weight:700;font-size:27px;color:var(--b700);
          background:#fff;border:2px solid var(--b100);padding:14px 28px;border-radius:999px;direction:ltr;}
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .toothWrap{position:relative;will-change:transform,opacity;}
  .tooth{width:225px;height:225px;filter:drop-shadow(0 22px 32px rgba(67,97,238,.32));display:block;}
  .spark{position:absolute;font-size:52px;will-change:transform,opacity;}
  .sp1{top:-18px;right:8px;} .sp2{bottom:26px;left:-16px;font-size:38px;}
  h1{margin:44px 0 0;font-weight:700;font-size:92px;line-height:1.24;letter-spacing:-1px;will-change:transform,opacity;}
  h1 .grad{background:linear-gradient(100deg,var(--b600),var(--b400));
           -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{margin:20px 0 0;font-size:38px;color:var(--s500);will-change:transform,opacity;}
  .grid{margin-top:58px;display:grid;grid-template-columns:1fr 1fr;gap:22px;width:900px;}
  .gcell{background:#fff;border:2px solid var(--b100);border-radius:26px;padding:28px 20px;
         font-size:36px;font-weight:700;color:var(--b700);display:flex;align-items:center;
         justify-content:center;gap:14px;box-shadow:0 16px 34px -20px rgba(43,58,133,.35);
         will-change:transform,opacity;}
  .gcell i{width:12px;height:12px;border-radius:50%;background:var(--b500);flex:none;}
  .card{background:#fff;border:2px solid var(--b100);border-radius:40px;padding:48px 56px;
        display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center;
        box-shadow:0 30px 60px -24px rgba(43,58,133,.4);will-change:transform,opacity;}
  .cta{font-size:38px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--b600),var(--b500));
       padding:26px 60px;border-radius:24px;box-shadow:0 16px 32px -12px rgba(67,97,238,.55);}
  .phoneRow{display:flex;align-items:center;gap:22px;direction:ltr;}
  .wa{width:70px;height:70px;flex:none;}
  .num{font-family:'Inter',sans-serif;font-weight:700;font-size:56px;letter-spacing:1px;white-space:nowrap;}
  .locRow{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:700;color:var(--b800);}
</style>
</head>
<body>
<div class="page">
<div class="blob b1"></div><div class="blob b2"></div>

  <div class="top" id="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M50 12 C32 12 25 23 25 35.5 C25 45 28.5 51 30 60 C31.5 70 33 87 40.5 87 C47.5 87 45.5 71.5 50 71.5 C54.5 71.5 52.5 87 59.5 87 C67 87 68.5 70 70 60 C71.5 51 75 45 75 35.5 C75 23 68 12 50 12 Z" fill="#fff"/>
        </svg>
      </div>
      <div class="cname" id="name"></div>
    </div>
    <div class="handle" id="handle"></div>
  </div>

  <div class="hero">
    <div class="toothWrap" id="tooth">
      <svg class="tooth" viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="tg" x1="20" y1="8" x2="80" y2="92" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4361ee"/><stop offset="1" stop-color="#818cf8"/>
          </linearGradient>
        </defs>
        <path d="M50 10 C31 10 24 22 24 35 C24 45 28 51 29.5 60 C31 70 32.5 88 40 88 C47 88 45 72 50 72 C55 72 53 88 60 88 C67.5 88 69 70 70.5 60 C72 51 76 45 76 35 C76 22 69 10 50 10 Z" fill="url(#tg)"/>
        <ellipse id="shine" cx="36" cy="26" rx="9" ry="5" transform="rotate(-32 36 26)" fill="#fff"/>
      </svg>
      <div class="spark sp1" id="sp1">✦</div>
      <div class="spark sp2" id="sp2">✦</div>
    </div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="grid" id="grid"></div>
  </div>

  <div class="card" id="card">
    <div class="cta" id="cta"></div>
    <div class="phoneRow">
      <svg class="wa" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 0 0-8.65 15.03L2 22l5.14-1.32A10 10 0 1 0 12 2Z" fill="#25D366"/>
        <path d="M8.7 7.6c.2-.5.42-.53.66-.54l.56-.01c.18 0 .38.03.58.47l.83 1.9c.1.22.04.44-.1.62l-.44.55c-.14.17-.3.36-.13.68.62 1.14 1.55 1.98 2.75 2.5.28.12.45.1.62-.06l.72-.78c.2-.22.4-.17.63-.08l1.83.9c.27.14.44.25.44.48-.03.53-.3 1.5-1.35 1.9-1 .4-2.3.32-4.4-.9-2.2-1.26-3.7-3.63-3.9-4.1-.2-.48-.02-.75.2-.98l.6-.55Z" fill="#fff"/>
      </svg>
      <div class="num" id="phone"></div>
    </div>
    <div class="locRow">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2Z" fill="#4361ee"/>
      </svg>
      <span id="loc"></span>
    </div>
  </div>

</div>

<script>
const BRAND = @@BRAND@@;
const qs    = new URLSearchParams(location.search);
const lang  = qs.get('lang') || 'ku';
const L     = BRAND[lang];
const rtl   = lang !== 'en';

/* ---- timeline (7s @ 30fps, frame-driven so every video frame is exact) ---- */
const FPS = 30, DUR = 7, N = FPS * DUR;
const fP  = qs.get('f');
const f   = fP === null ? N - 1 : Math.max(0, Math.min(N - 1, +fP));
const t   = f / FPS;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ph  = (s, e) => clamp((t - s) / (e - s), 0, 1);
const eoc = p => 1 - Math.pow(1 - p, 3);
const eob = p => { const c = 2.0, x = p - 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const el  = id => document.getElementById(id);
const put = (id, p, dy = 0, sc = 1) => {
  el(id).style.opacity = p;
  el(id).style.transform = `translateY(${dy * (1 - p)}px) scale(${sc})`;
};

document.documentElement.lang = lang;
document.documentElement.dir  = rtl ? 'rtl' : 'ltr';
el('name').textContent   = L.name;
el('handle').textContent = BRAND.handle;
el('phone').textContent  = BRAND.phone;
el('loc').textContent    = L.location;
el('cta').textContent    = L.cta;
el('sub').textContent    = L.sub;
el('h1').innerHTML = `<span id="hl1">${L.headline1}</span><br>` +
                     `<span class="grad" id="hl2">${L.headline2}</span>`;
el('grid').innerHTML = L.chips.map(c => `<div class="gcell"><i></i>${c}</div>`).join('');

/* ---- choreography ---- */
put('top', eoc(ph(0.20, 1.20)), -36);

const tp = eob(ph(1.00, 1.90));
el('tooth').style.opacity = clamp(ph(1.00, 1.45), 0, 1);
el('tooth').style.transform = `scale(${0.55 + 0.45 * tp})`;

const sh = ph(1.95, 2.55);
el('shine').style.opacity = Math.sin(sh * Math.PI) * 0.9;

put('hl1', eoc(ph(1.80, 2.50)), 46);
put('hl2', eoc(ph(2.10, 2.85)), 46);
put('sub', eoc(ph(2.70, 3.40)), 30);

L.chips.forEach((c, i) => {
  const p = eob(ph(3.20 + i * 0.38, 3.65 + i * 0.38));
  el('grid').children[i].style.opacity = clamp(p, 0, 1);
  el('grid').children[i].style.transform = `translateY(${26 * (1 - p)}px) scale(${0.7 + 0.3 * p})`;
});

const cp = eoc(ph(5.10, 6.00));
const pulse = t > 6.1 ? 1 + 0.02 * Math.sin((t - 6.1) * Math.PI * 2 * 1.1) : 1;
put('card', cp, 64, pulse);

const s1 = ph(4.70, 5.60), s2 = ph(5.00, 5.90);
el('sp1').style.opacity = Math.sin(s1 * Math.PI);
el('sp1').style.transform = `scale(${0.4 + 0.6 * Math.sin(s1 * Math.PI)}) rotate(20deg)`;
el('sp2').style.opacity = Math.sin(s2 * Math.PI) * 0.9;
el('sp2').style.transform = `scale(${0.4 + 0.6 * Math.sin(s2 * Math.PI)}) rotate(-15deg)`;
</script>
</body>
</html>
